    html,
    body,

    main {
      margin: 0.5rem;

      <h1>anna lang</h1>

  1.+(n)
}

main {
  0.iterate(incr).take(5)
}
      </textarea>
      <div>
        <button id="run">run</button>
      </div>
      <code id="output"></code>
    </main>
    <script
      defer
