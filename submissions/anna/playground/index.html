<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>anna playground</title>
    <style>
    html,
    body,
    h1 {
      border: 0;
      padding: 0;
      margin: 0;
      font-family: monospace;
    }
    main {
      margin: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    textarea {
      resize: vertical;
      height: 50vh;
      font-size: 16pt;
    }
    h1,
    code,
    button {
      font-size: 12pt;
      font-family: monospace;
    }
    </style>
  </head>
  <body>
    <main>
      <h1>anna lang</h1>
      <textarea
        id="source-code"
        autocorrect="off"
        autocomplete="off"
        spellcheck="false"
      >
replace next(tuple) with {
  replace counter with tuple.@(0).-(1)
  [counter, tuple.@(1).*(counter)]
}

replace aboveone(tuple) with {
  tuple.@(0)./=(1)
}

replace factorial(x) with {
  [x, x]
  .iterate(next)
  .while(aboveone)
  .@(1)
}

main {
  5.factorial()
}
      </textarea>
      <div>
        <button id="run">run</button>
      </div>
      <code id="output"></code>
    </main>
    <script
      defer
      src="./index.js?v=E379A2EE-7AD1-43C7-8E18-DF5F9D6AF19D"
      type="module"></script>
  </body>
</html>
