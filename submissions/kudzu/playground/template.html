<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kudzu</title>
<style>
  :root {
    --ground: #0d0f0c;
    --panel: #141712;
    --rule: #262a22;
    --ink: #e8ece4;
    --muted: #8b9184;
    --vine: #8fd14f;
    --dead: #6b4a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 15px; letter-spacing: .12em; color: var(--vine); }
  header p { margin: 0; color: var(--muted); }
  main {
    display: grid; grid-template-columns: minmax(320px, 2fr) 3fr;
    gap: 1px; background: var(--rule); min-height: calc(100vh - 52px);
  }
  section { background: var(--ground); padding: 14px 18px; min-width: 0; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  select, button, input {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); padding: 4px 9px; border-radius: 2px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--vine); color: var(--vine); }
  button:disabled { opacity: .4; cursor: default; }
  button.go { border-color: var(--vine); color: var(--vine); }
  textarea {
    width: 100%; height: 340px; resize: vertical; background: var(--panel);
    color: var(--ink); border: 1px solid var(--rule); border-radius: 2px;
    padding: 10px; font: inherit; tab-size: 2;
  }
  label { color: var(--muted); }
  input[type=number] { width: 68px; }
  input[type=range] { width: 110px; vertical-align: middle; }
  h2 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); font-weight: 400;
  }
  #frames, #rules {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 2px;
    padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  #frames { height: 52vh; }
  #rules { height: 24vh; margin-top: 14px; }
  .n { color: var(--muted); }
  .new { color: var(--vine); }
  .learned { color: var(--vine); }
  .warn { color: #e0c060; }
  .err { color: #e07070; }
  .note { color: var(--muted); margin: 10px 0 0; }
  a { color: var(--vine); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>KUDZU</h1>
  <p>a term rewriting language where evaluation is growth. nothing here is ever the answer.</p>
</header>
<main>
  <section>
    <div class="bar">
      <select id="example"></select>
      <button id="reset">reset</button>
    </div>
    <textarea id="source" spellcheck="false"></textarea>
    <div class="bar" style="margin-top:10px">
      <button id="go" class="go" disabled>grow</button>
      <button id="step" disabled>step</button>
      <label>stop at <input id="limit" type="number" value="200" min="1" max="2000"></label>
      <label>slow <input id="speed" type="range" min="0" max="400" value="60"></label>
    </div>
    <p class="note" id="status">loading python...</p>
  </section>
  <section>
    <h2>the term</h2>
    <div id="frames"></div>
    <h2 style="margin-top:14px">the rulebook</h2>
    <div id="rules"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const SOURCES = /*SOURCES*/;
const EXAMPLES = /*EXAMPLES*/;

// the playground's only python: a handle on the machine the CLI also uses.
const DRIVER = `
import sys
sys.setrecursionlimit(20000)
sys.path.insert(0, '/kudzu')

from src.check import check
from src.parse import parse
from src.render import Camera
from src.rewrite import Machine
from src.term import exceeds


class Session(object):
    # a parallel program doubles its term every frame, so a frame count is no
    # protection at all. the browser gets a smaller allowance than the CLI
    # because here the cost is drawing the thing, not growing it.
    BUDGET = 20000

    def __init__(self, source):
        self.program = parse(source)
        self.machine = Machine(self.program)
        self.camera = Camera(view=self.program.view,
                             watch=self.program.watch, width=1200)

    def warnings(self):
        return check(self.program)

    def frame(self):
        return [self.machine.frame, self.camera.body(self.machine)]

    def step(self):
        if not self.machine.step():
            return 'halted'
        if exceeds(self.machine.term, self.BUDGET):
            return 'overgrown'
        return 'growing'

    def rulebook(self):
        return [[r.origin, str(r)] for r in self.machine.rules]
`;

const $ = (id) => document.getElementById(id);
const framesEl = $("frames"), rulesEl = $("rules"), statusEl = $("status");
let py = null, session = null, timer = null, previous = "";

const escape = (s) => s.replace(/[&<>]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

function say(text, kind) {
  statusEl.className = "note" + (kind ? " " + kind : "");
  statusEl.textContent = text;
}

function shared(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i;
}

function addFrame(n, body) {
  // highlight whatever is new since the previous frame
  const cut = shared(previous, body);
  previous = body;
  const line = document.createElement("div");
  line.innerHTML = '<span class="n">' + String(n).padStart(4) + "</span>  " +
    escape(body.slice(0, cut)) + '<span class="new">' + escape(body.slice(cut)) + "</span>";
  framesEl.appendChild(line);
  framesEl.scrollTop = framesEl.scrollHeight;
}

function showRules() {
  const book = session.rulebook().toJs();
  rulesEl.innerHTML = book.map(([origin, text]) =>
    origin === "learned"
      ? '<div class="learned">  + ' + escape(text) + "</div>"
      : "<div>    " + escape(text) + "</div>").join("");
}

function stopGrowing() {
  if (timer) { clearInterval(timer); timer = null; }
  $("go").textContent = "grow";
}

function plant() {
  stopGrowing();
  framesEl.textContent = "";
  rulesEl.textContent = "";
  previous = "";
  try {
    session = py.globals.get("Session")($("source").value);
  } catch (e) {
    session = null;
    say(String(e.message || e).trim().split("\n").pop(), "err");
    return false;
  }
  const warnings = session.warnings().toJs();
  const [n, body] = session.frame().toJs();
  addFrame(n, body);
  showRules();
  say(warnings.length ? warnings.join(" ") : "seeded.", warnings.length ? "warn" : null);
  return true;
}

function advance() {
  if (!session) return;
  let status;
  try {
    status = session.step();
  } catch (e) {
    stopGrowing();
    say(String(e.message || e).trim().split("\n").pop(), "err");
    return;
  }
  if (status === "halted") {
    stopGrowing();
    say("halted after " + session.machine.frame + " frames: no rule matched.", "warn");
    return;
  }
  const [n, body] = session.frame().toJs();
  addFrame(n, body);
  showRules();
  if (status === "overgrown") {
    stopGrowing();
    say("stopped at frame " + n + ": the term passed " + session.BUDGET + " nodes.");
    return;
  }
  if (n >= Number($("limit").value)) {
    stopGrowing();
    say("stopped at frame " + n + ": the limit.");
  }
}

$("go").onclick = () => {
  if (timer) { stopGrowing(); say("paused at frame " + session.machine.frame + "."); return; }
  if (!session && !plant()) return;
  $("go").textContent = "pause";
  say("growing...");
  timer = setInterval(advance, Number($("speed").value));
};
$("step").onclick = () => { stopGrowing(); if (session || plant()) advance(); };
$("reset").onclick = () => { if (plant()) say("reseeded."); };
$("source").oninput = () => { stopGrowing(); session = null; };
$("speed").oninput = () => { if (timer) { clearInterval(timer); timer = setInterval(advance, Number($("speed").value)); } };

const picker = $("example");
Object.keys(EXAMPLES).forEach((name) => {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  picker.appendChild(option);
});
picker.value = "sieve.kudzu";
picker.onchange = () => { $("source").value = EXAMPLES[picker.value]; session = null; stopGrowing(); plant(); };
$("source").value = EXAMPLES["sieve.kudzu"];

(async () => {
  try {
    py = await loadPyodide();
    py.FS.mkdirTree("/kudzu/src");
    for (const [path, text] of Object.entries(SOURCES)) py.FS.writeFile("/kudzu/" + path, text);
    py.runPython(DRIVER);
    $("go").disabled = false;
    $("step").disabled = false;
    plant();
  } catch (e) {
    say("could not start python: " + e, "err");
  }
})();
</script>
</body>
</html>
